name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy HTML and static assets to site folder
        run: |
          mkdir -p _site/images
          mkdir -p _site/publications
          mkdir -p _site/uploads
          mkdir -p _site/blog
          cp layouts/landing/list.html _site/index.html
          cp layouts/publications/list.html _site/publications/index.html
          cp layouts/blog/list.html _site/blog/index.html
          if [ -d layouts/blog/posts ]; then
            for f in layouts/blog/posts/*.html; do
              [ -e "$f" ] || continue
              slug=$(basename "$f" .html)
              mkdir -p "_site/blog/$slug"
              cp "$f" "_site/blog/$slug/index.html"
            done
          fi
          cp -r static/images/. _site/images/
          cp -r static/uploads/. _site/uploads/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
